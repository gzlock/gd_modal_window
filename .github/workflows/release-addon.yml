name: Release Addon Zip

on:
  push:
    tags:
      - 'v*.*'

jobs:
  create_release:
    name: Create GitHub Release with Addon Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug file structure
        run: ls -R

      - name: Create release zip file
        run: |
          zip -r ./for_godot_asset_library.zip ./addons
          cd ./addons
          zip -r ../modal_window.zip ./modal_window
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the zip files to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./modal_window.zip
            ./for_godot_asset_library.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
